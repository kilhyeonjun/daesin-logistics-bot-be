name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./logistics.db
      API_KEY: ci-test-api-key
      JWT_SECRET: ci-test-jwt-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm test
      - run: npm run build
      - run: npm run verify:ingestion
      - run: bash tests/deploy-blue-green.test.sh
      - run: docker compose config --quiet
      - run: npm audit --audit-level=high
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build production image without deploying
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: daesin-quality-ci
          cache-from: type=gha,scope=daesin-quality-ci-linux-amd64
          cache-to: type=gha,mode=max,scope=daesin-quality-ci-linux-amd64
      - name: Verify production Prisma runtime with isolated SQLite
        run: |
          docker run --rm --entrypoint node -e DATABASE_URL=file:/tmp/quality.sqlite daesin-quality-ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { PrismaClient, Prisma } from "@prisma/client";
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            assert(major > 20 || (major === 20 && (minor > 18 || (minor === 18 && patch >= 1))));
            const db = new PrismaClient();
            try {
              const rows = await db.$queryRawUnsafe("SELECT 1 AS result");
              assert.equal(Number(rows[0].result), 1);
              console.log(JSON.stringify({ node: process.versions.node, prisma: Prisma.prismaVersion, sqliteQuery: "passed" }));
            } finally { await db.$disconnect(); }
          '
