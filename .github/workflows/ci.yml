name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./logistics.db
      API_KEY: ci-test-api-key
      JWT_SECRET: ci-test-jwt-secret
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm test
      - run: npm run build
      - run: npm run verify:ingestion
      - run: bash tests/deploy-blue-green.test.sh
      - run: docker compose config --quiet
      - run: npm audit --audit-level=high
      - name: Build production image without deploying
        run: docker build -t daesin-quality-ci .
      - name: Verify production Prisma runtime with isolated SQLite
        run: |
          docker run --rm --entrypoint node -e DATABASE_URL=file:/app/data/quality.sqlite daesin-quality-ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { PrismaClient, Prisma } from "@prisma/client";
            const [major, minor, patch] = process.versions.node.split(".").map(Number);
            assert(major > 20 || (major === 20 && (minor > 18 || (minor === 18 && patch >= 1))));
            const db = new PrismaClient();
            try {
              await db.$executeRawUnsafe("CREATE TABLE smoke (value INTEGER NOT NULL)");
              await db.$executeRawUnsafe("INSERT INTO smoke (value) VALUES (1)");
              const rows = await db.$queryRawUnsafe("SELECT value AS result FROM smoke");
              assert.equal(Number(rows[0].result), 1);
              console.log(JSON.stringify({ node: process.versions.node, prisma: Prisma.prismaVersion, sqliteQuery: "passed" }));
            } finally { await db.$disconnect(); }
          '
